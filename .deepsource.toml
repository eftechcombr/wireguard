version = 1

test_patterns = [
  "**/*_test.go"
]

[[analyzers]]
name = "shell"

[[analyzers]]
name = "go"

  [analyzers.meta]
  import_root = "github.com/eftechcombr/wireguard"
  skip_doc_coverage = ["file"]

[[analyzers]]
name = "docker"

  [analyzers.meta]
  dockerfile_paths = ["./"]

[[analyzers]]
name = "secrets"
