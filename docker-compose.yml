services:
  wireguard:
    image: eftechcombr/wireguard:latest
    build: . 
    cap_add:
      - NET_ADMIN
    sysctls:
     - net.ipv4.ip_forward=1
    volumes: 
      - /dev/net/tun:/dev/net/tun
      - ./etc:/etc/wireguard:ro 
    ports: 
      - "51820:51820/UDP"
      - "8080:8080"
    environment:
      WG_LOG_INTERVAL: ${WG_LOG_INTERVAL:-5s}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wireguard}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${OTEL_EXPORTER_OTLP_LOGS_HEADERS:-}
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-}
      OTEL_EXPORTER_OTLP_LOGS_TIMEOUT: ${OTEL_EXPORTER_OTLP_LOGS_TIMEOUT:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
