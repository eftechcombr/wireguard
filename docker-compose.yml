services:
  wireguard:
    image: eftechcombr/wireguard:latest
    build: . 
    cap_add:
      - NET_ADMIN
    sysctls:
     - net.ipv4.ip_forward=1
    volumes: 
      - /dev/net/tun:/dev/net/tun
      - ./etc:/etc/wireguard:ro 
    ports: 
      - "51820:51820/UDP"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
